<!DOCTYPE html>
<html>
<head>
    <title>Physics Particle Simulator</title>
    <link rel="stylesheet" href="../shared.css?v=1b232de9">
    <style>
        body {
            display: flex;
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
        }
        
        #controls {
            width: 300px;
            padding: 20px;
            background: #f5f5f5;
        }
        
        .control-group {
            margin-bottom: 20px;
        }
        
        .control-group h3 {
            margin: 0 0 10px 0;
        }
        
        .slider-container {
            margin: 10px 0;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
        }
        
        select, button {
            width: 100%;
            padding: 5px;
            margin: 5px 0;
        }
        
        /* body is display:flex. Without these the canvas's intrinsic width
           (its width attribute) fought the flex algorithm: the panel was
           squeezed below its own basis and the canvas still overflowed the
           viewport. Pin the panel, let the canvas take exactly what is left. */
        #controls {
            flex: 0 0 auto;
            overflow-y: auto;
        }

        canvas {
            border: 1px solid #ccc;
            margin-left: 20px;
            flex: 1 1 0;
            min-width: 0;
            display: block;
        }
        
        label[title] {
            cursor: help;
            border-bottom: 1px dotted #666;
        }

        .performance-stats {
            background: #e0e0e0;
            padding: 10px;
            border-radius: 4px;
            margin-top: 10px;
        }

        .sim-buttons { display: flex; gap: 8px; margin-bottom: 10px; }
        .sim-buttons button { flex: 1; }
        .performance-stats div {
            margin: 5px 0;
        }

        /* Tooltip styling */
        [title] {
            position: relative;
            display: inline-block;
        }

        [title]:hover::after {
            content: attr(title);
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            padding: 5px 10px;
            background: #333;
            color: white;
            border-radius: 4px;
            font-size: 12px;
            white-space: nowrap;
            z-index: 1000;
        }

        .speed-presets {
            margin-top: 10px;
            display: flex;
            gap: 5px;
        }

        .speed-presets button {
            padding: 5px 10px;
            background: #444;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }

        .speed-presets button:hover {
            background: #666;
        }

        .wide-slider {
            width: 200px;
        }
    </style>
</head>
<body>
    <div id="controls">
        <div class="control-group">
            <h3>Simulation Type</h3>
            <select id="simulationType">
                <option value="default">Free Particles</option>
                <option value="solarSystem">Solar System</option>
                <option value="gasMolecules">Gas Molecules</option>
                <option value="electricField">Electric Field</option>
            </select>
        </div>

        <div class="particle-control">
            <div class="control-group">
                <h3>Physics Controls</h3>
                <div class="slider-container">
                    <label title="Strength of gravitational force">
                        Gravity Strength: <span id="gravityValue">500</span>
                    </label>
                    <input type="range" id="gravity" min="0" max="1000" value="500">
                </div>
                <div class="slider-container">
                    <label title="How bouncy particles are">
                        Elasticity: <span id="elasticityValue">0.7</span>
                    </label>
                    <input type="range" id="elasticity" min="0" max="100" value="70">
                </div>
                <div class="slider-container">
                    <label>Particle Mass: <span id="massValue">1</span></label>
                    <input type="range" id="mass" min="1" max="100" value="10">
                </div>
            </div>

            <div class="control-group">
                <h3>Particle Creation</h3>
                <div class="slider-container">
                    <label>Initial Velocity: <span id="initialVelocityValue">100</span></label>
                    <input type="range" id="initialVelocity" min="0" max="500" value="100">
                </div>
            </div>
        </div>

        <div class="solar-system-control">
            <div class="control-group">
                <h3>Solar System Controls</h3>
                <select id="celestialPreset">
                    <option value="default">Normal Sun</option>
                    <option value="blackhole">Black Hole</option>
                    <option value="neutron">Neutron Star</option>
                    <option value="dwarf">Dwarf Star</option>
                    <option value="supergiant">Supergiant Star</option>
                </select>

                <div class="slider-container">
                    <label>Central Body Size: <span id="sunRadiusValue">15</span></label>
                    <input type="range" id="sunRadius" min="3" max="50" value="15" step="1">
                </div>
                <div class="slider-container">
                    <label>Central Body Mass: <span id="sunMassValue">1000</span></label>
                    <input type="range" id="sunMass" min="100" max="5000" value="1000" step="100">
                </div>
                <div class="slider-container">
                    <label>Gravitational Strength: <span id="gravityStrengthValue">1.0</span></label>
                    <input type="range" id="gravityStrength" min="10" max="5000" value="500" step="10">
                </div>
                <div class="slider-container">
                    <label>Orbital Speed: <span id="orbitalSpeedValue">1.0</span></label>
                    <input type="range" id="orbitalSpeed" min="50" max="2000" value="200" step="10">
                </div>
                <div class="speed-presets">
                    <!-- Speed preset buttons -->
                </div>
            </div>
        </div>

        <div class="charge-control">
            <div class="control-group">
                <h3>Particle Interaction</h3>
                <div class="slider-container">
                    <label>Charge Strength: <span id="chargeValue">0</span></label>
                    <input type="range" id="charge" min="-100" max="100" value="0">
                </div>
            </div>
        </div>

        <div class="gas-control">
            <div class="control-group">
                <h3>Gas Molecule Controls</h3>
                <div class="slider-container">
                    <label>Gas Elasticity: <span id="gasElasticityValue">0.7</span></label>
                    <input type="range" id="gasElasticity" min="0" max="100" value="70">
                </div>
                <div class="slider-container">
                    <label>Gas Initial Velocity: <span id="gasInitialVelocityValue">100</span></label>
                    <input type="range" id="gasInitialVelocity" min="0" max="500" value="100">
                </div>
            </div>
        </div>

        <div class="control-group">
            <h3>Boundary Type</h3>
            <select id="boundaryType">
                <option value="solid">Solid Walls</option>
                <option value="wrap">Wrap Around</option>
                <option value="open">Open Boundaries</option>
            </select>
        </div>

        <div class="control-group">
            <h3>Performance & Particles</h3>
            <div class="slider-container">
                <label>Particles per Click: <span id="particlesPerClickValue">5</span></label>
                <input type="range" id="particlesPerClick" min="1" max="50" value="5">
            </div>
            <div class="slider-container">
                <label>Simulation Precision: <span id="precisionValue">1</span></label>
                <input type="range" id="precision" min="1" max="10" value="1">
            </div>
            <div class="performance-stats">
                <div>FPS: <span id="fpsCounter">0</span></div>
                <div>Particles: <span id="particleCounter">0</span></div>
                <div>Kinetic energy: <span id="keReadout">0</span></div>
                <div>Momentum: <span id="momentumReadout">0</span></div>
            </div>
        </div>

        <div class="sim-buttons">
            <button id="pauseToggle">Pause</button>
            <button id="stepOnce">Step</button>
        </div>
        <button id="clearParticles">Clear All Particles</button>
    </div>

    <canvas id="simulationCanvas"></canvas>
    <script src="src/Particle.js?v=d059f0ee"></script>
    <script src="src/SpatialGrid.js?v=01d9fab7"></script>
    <script src="src/ParticleSystem.js?v=55341aa1"></script>
    <script src="src/main.js?v=6f8f8451"></script>
    <script src="src/enhance.js?v=c912555d"></script>
    <script src="../header.js?v=77d3f109"></script>
    <script>
        const canvas = document.getElementById('simulationCanvas');

        const system = new ParticleSystem(canvas, {
            gravity: 500,
            particleSize: 10,
            elasticity: 0.7
        });

        initializeControls(system);

        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            system.createParticlesAtPoint(e.clientX - rect.left, e.clientY - rect.top);
        });

        // Fixed-timestep driver. Feeding the raw frame delta into update() made
        // the physics framerate-dependent -- update() clamps dt to 0.016, so
        // below ~62fps the simulation quietly ran in slow motion. The driver
        // also owns canvas sizing, which previously happened once at load and
        // never again.
        const fpsMeter = { frames: 0, last: performance.now() };
        const driver = SimulationDriver(system, canvas, {
            onFrame() {
                fpsMeter.frames++;
                const now = performance.now();
                if (now - fpsMeter.last >= 500) {
                    const value = Math.round((fpsMeter.frames * 1000) / (now - fpsMeter.last));
                    fpsMeter.frames = 0;
                    fpsMeter.last = now;

                    const m = system.measure();
                    document.getElementById('fpsCounter').textContent = value;
                    document.getElementById('particleCounter').textContent = m.count;
                    document.getElementById('keReadout').textContent = m.kinetic.toExponential(2);
                    document.getElementById('momentumReadout').textContent = m.momentum.toExponential(2);
                }
            }
        });

        const pauseBtn = document.getElementById('pauseToggle');
        pauseBtn.addEventListener('click', () => {
            pauseBtn.textContent = driver.toggle() ? 'Resume' : 'Pause';
        });
        document.getElementById('stepOnce').addEventListener('click', () => {
            driver.setPaused(true);
            pauseBtn.textContent = 'Resume';
            driver.step();
        });
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
            if (e.code === 'Space') { e.preventDefault(); pauseBtn.click(); }
            if (e.key === '.') document.getElementById('stepOnce').click();
        });

    </script>
</body>
</html>
