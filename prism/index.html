<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#0b1020" />
<title>Endless Hills</title>
<style>
  :root { --ui: rgba(255,255,255,0.85); }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; background:#8fc7ef; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; touch-action:none; overscroll-behavior:none; }
  #scene { position:fixed; inset:0; display:block; touch-action:none; }

  /* ---- Start overlay ---- */
  #start {
    position:fixed; inset:0; z-index:30;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:linear-gradient(180deg,#bfe0fb 0%, #9ecdf5 45%, #d9eecb 100%);
    color:#3a4a55; text-align:center; padding:24px; gap:18px;
    transition:opacity .8s ease;
  }
  #start h1 { font-weight:600; font-size:clamp(28px,8vw,52px); letter-spacing:.04em; text-shadow:0 1px 0 rgba(255,255,255,.5); }
  #start p { font-size:clamp(14px,4vw,18px); max-width:540px; line-height:1.5; opacity:.85; }
  #start p.warn { font-style:italic; opacity:.7; max-width:460px; }
  #start .play {
    margin-top:8px; padding:16px 44px; border:none; border-radius:999px;
    background:#5a8f3c; color:#fff; font-size:clamp(16px,4.5vw,20px); font-weight:600;
    box-shadow:0 8px 24px rgba(60,100,40,.35); cursor:pointer; letter-spacing:.05em;
  }
  #start .play:active { transform:translateY(2px); }
  #start small { opacity:.6; font-size:12px; margin-top:10px; }

  /* ---- HUD / touch controls ---- */
  #hud { position:fixed; inset:0; z-index:10; pointer-events:none; opacity:0; transition:opacity 1s ease; }
  #hud.on { opacity:1; }

  /* left joystick */
  #stick {
    position:absolute; left:max(24px,env(safe-area-inset-left)); bottom:max(36px,env(safe-area-inset-bottom));
    width:140px; height:140px; border-radius:50%;
    background:rgba(255,255,255,0.12); border:2px solid rgba(255,255,255,0.4);
    pointer-events:auto; touch-action:none;
  }
  #stick .nub {
    position:absolute; left:50%; top:50%; width:62px; height:62px; margin:-31px 0 0 -31px;
    border-radius:50%; background:rgba(255,255,255,0.7); box-shadow:0 2px 10px rgba(0,0,0,.2);
  }
  #hint {
    position:absolute; right:max(20px,env(safe-area-inset-right)); bottom:max(40px,env(safe-area-inset-bottom));
    color:var(--ui); font-size:13px; text-align:right; text-shadow:0 1px 3px rgba(0,0,0,.45); max-width:190px;
  }
  #sound {
    position:absolute; top:max(16px,env(safe-area-inset-top)); right:max(16px,env(safe-area-inset-right));
    width:46px; height:46px; border-radius:50%; pointer-events:auto;
    background:rgba(255,255,255,0.18); border:1px solid rgba(255,255,255,0.45);
    color:#fff; font-size:20px; display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  #fade { position:fixed; inset:0; z-index:20; background:#dff0cf; pointer-events:none; opacity:0; transition:opacity 1.2s ease; }
</style>
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="fade"></div>

  <div id="hud">
    <div id="stick"><div class="nub"></div></div>
    <div id="hint">Click to look · WASD / arrows to move</div>
    <div id="sound" title="Toggle sound">♪</div>
  </div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.161.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.161.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ============================================================
   Endless Hills — a calm, eerie first-person mobile walking sim.
   Infinite procedural terrain & grass, a living day/night sky,
   cinematic post-processing, generative ambient sound, and a
   house at the end of the lane that creeps closer when unwatched.
   ============================================================ */

const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;   // OutputPass applies this (linear -> display)
renderer.toneMappingExposure = 1.06;   // brighter, sunnier exposure

const scene = new THREE.Scene();
const FOG_COLOR = new THREE.Color(0xc8e6f7);
scene.fog = new THREE.Fog(FOG_COLOR.getHex(), 30, 108);

const camera = new THREE.PerspectiveCamera(72, innerWidth/innerHeight, 0.1, 3000);
const EYE = 2.6;

const smoothstep = (a,b,x)=>{ const t=THREE.MathUtils.clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); };
const WHITE = new THREE.Color(0xffffff);

/* ---------- Lighting (driven by the day/night cycle) ---------- */
const hemi = new THREE.HemisphereLight(0xdff1ff, 0x5b8a3a, 0.95);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff6e0, 1.1);
scene.add(sun);
const moon = new THREE.DirectionalLight(0x9db4ff, 0.0);
scene.add(moon);

/* ============================================================
   Procedural height field — gentle rolling hills.
   ============================================================ */
function hash(ix, iz){
  // Integer murmur-style mix. The old sin() hash needed float64 — fract of
  // sin()*43758 falls apart in float32 — but the grass shader has to evaluate
  // this same field on the GPU so every blade roots itself exactly on the
  // terrain. Integer mixing is bit-exact in both JS (Math.imul) and GLSL uints.
  let n = (Math.imul(ix|0, 0x27d4eb2d) ^ Math.imul(iz|0, 0x165667b1)) >>> 0;
  n = Math.imul(n ^ (n >>> 15), 0x85ebca6b) >>> 0;
  n = (n ^ (n >>> 13)) >>> 0;
  return (n >>> 8) / 16777216;
}
function valueNoise(x, z){
  const ix = Math.floor(x), iz = Math.floor(z);
  const fx = x - ix, fz = z - iz;
  const ux = fx*fx*(3-2*fx), uz = fz*fz*(3-2*fz);
  const a = hash(ix, iz),     b = hash(ix+1, iz);
  const c = hash(ix, iz+1),   d = hash(ix+1, iz+1);
  return a*(1-ux)*(1-uz) + b*ux*(1-uz) + c*(1-ux)*uz + d*ux*uz;
}
function terrainHeight(x, z){
  let h = 0;
  h += 7.5 * valueNoise(x*0.018, z*0.018);
  h += 2.6 * valueNoise(x*0.055, z*0.05);
  h += 0.7 * valueNoise(x*0.16,  z*0.15);
  return h - 5.0;
}

/* ============================================================
   Terrain mesh — recenters on the player every frame.
   ============================================================ */
const TERRAIN_SIZE = 340, TERRAIN_SEG = 170;   // larger so the fog can sit further out (less foggy)
const terrainGeo = new THREE.PlaneGeometry(TERRAIN_SIZE, TERRAIN_SIZE, TERRAIN_SEG, TERRAIN_SEG);
terrainGeo.rotateX(-Math.PI/2);
// procedural, tileable grass texture so the ground reads as grass, not flat green
function makeGroundTexture(){
  const c=document.createElement('canvas'); c.width=c.height=512;
  const g=c.getContext('2d');
  g.fillStyle='#6fb24a'; g.fillRect(0,0,512,512);
  for(let i=0;i<70;i++){                      // soft lighter / darker patches
    const x=Math.random()*512, y=Math.random()*512, r=26+Math.random()*90;
    const grd=g.createRadialGradient(x,y,0,x,y,r);
    grd.addColorStop(0, Math.random()<0.5?'rgba(158,206,102,0.30)':'rgba(62,130,50,0.30)');
    grd.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=grd; g.beginPath(); g.arc(x,y,r,0,Math.PI*2); g.fill();
  }
  for(let i=0;i<3000;i++){                     // tiny grass blades
    const x=Math.random()*512, y=Math.random()*512;
    const h=3+Math.random()*7, lean=Math.random()*4-2;
    const s=92+Math.floor(Math.random()*86);
    g.strokeStyle=`rgb(${s-34},${s+38},${s-58})`;   // warm green, no teal cast up close
    g.lineWidth=1+Math.random(); g.lineCap='round';
    g.beginPath(); g.moveTo(x,y); g.lineTo(x+lean,y-h); g.stroke();
  }
  const tex=new THREE.CanvasTexture(c);
  tex.colorSpace=THREE.SRGBColorSpace;
  tex.wrapS=tex.wrapT=THREE.RepeatWrapping;
  tex.anisotropy=4;
  return tex;
}
const groundTex = makeGroundTexture();
const terrainMat = new THREE.MeshStandardMaterial({ map:groundTex, color:0xffffff, roughness:1, metalness:0 });
const terrain = new THREE.Mesh(terrainGeo, terrainMat);
terrain.frustumCulled = false;
scene.add(terrain);

const tPos = terrainGeo.attributes.position;
const tUV  = terrainGeo.attributes.uv;
const UV_SCALE = 0.18;   // grass texture tiles ~every 5–6 world units

let lastTOX = Infinity, lastTOZ = Infinity;
function updateTerrain(px, pz){
  const step = TERRAIN_SIZE / TERRAIN_SEG;
  const ox = Math.round(px/step)*step;
  const oz = Math.round(pz/step)*step;
  terrain.position.set(ox, 0, oz);
  if (ox === lastTOX && oz === lastTOZ) return;  // only rebuild when the mesh recenters
  lastTOX = ox; lastTOZ = oz;
  for (let i=0; i<tPos.count; i++){
    const lx = tPos.getX(i), lz = tPos.getZ(i);
    const wx = lx+ox, wz = lz+oz;
    tPos.setY(i, terrainHeight(wx, wz));
    tUV.setXY(i, wx*UV_SCALE, wz*UV_SCALE);   // world-locked UVs → grass won't swim as the mesh recenters
  }
  tPos.needsUpdate = true;
  tUV.needsUpdate = true;
  terrainGeo.computeVertexNormals();
}

/* ============================================================
   Geometry merge helper (position + uv + index).
   ============================================================ */
function mergeGeoms(geos){
  let vc=0, ic=0;
  geos.forEach(g=>{ vc+=g.attributes.position.count; ic+=g.index.count; });
  const pos=new Float32Array(vc*3), uv=new Float32Array(vc*2), idx=new Uint16Array(ic);
  let vo=0, io=0, base=0;
  geos.forEach(g=>{
    pos.set(g.attributes.position.array, vo*3);
    uv.set(g.attributes.uv.array, vo*2);
    const gi=g.index.array;
    for(let i=0;i<gi.length;i++) idx[io+i]=gi[i]+base;
    base+=g.attributes.position.count; vo+=g.attributes.position.count; io+=gi.length;
  });
  const m=new THREE.BufferGeometry();
  m.setAttribute('position',new THREE.BufferAttribute(pos,3));
  m.setAttribute('uv',new THREE.BufferAttribute(uv,2));
  m.setIndex(new THREE.BufferAttribute(idx,1));
  return m;
}

/* ============================================================
   Grass — real per-blade geometry, after SimonDev's Quick_Grass
   (github.com/simondevyoutube/Quick_Grass). No textures, no
   billboards: each blade is a tapered strip curled along a
   curve in the vertex shader. Wind is a wandering noise field
   that leans whole blades; broken gust fronts (kept from the
   old card grass — they read beautifully from the hilltop)
   multiply the lean; walking through pushes blades apart.
   Blades live in pooled patch meshes on a world grid with
   three LOD tiers, and every blade roots itself on the terrain
   by evaluating the SAME height field as the JS (see hash()).
   ============================================================ */
const IS_COARSE = matchMedia('(pointer:coarse)').matches;
const GRASS_PATCH     = 8;                                   // world units per patch tile
const GRASS_BLADES    = IS_COARSE ? 1024 : 2048;             // blades per near/mid patch
const GRASS_FAR_BLADES= IS_COARSE ? 512  : 640;              // sparser, wider blades far out
const GRASS_SEG_HI    = IS_COARSE ? 4 : 6, GRASS_SEG_LO = 1; // strip segments per blade
const GRASS_LOD_DIST  = IS_COARSE ? 12 : 18;                 // high-detail radius
const GRASS_MID_DIST  = IS_COARSE ? 26 : 34;
const GRASS_MAX_DIST  = IS_COARSE ? 40 : 56;                 // blades shrink to nothing here
const GRASS_W = 0.075, GRASS_H = 0.85;                       // base blade size

// Shared GLSL: uniforms, helpers, murmur hashes + value noise for wind and
// per-blade variation (float-bits murmur, exact at any coordinate), and the
// bit-exact GLSL twin of the JS terrainHeight so blades sit on the ground.
const GRASS_GLSL = `
uniform float uTime;
uniform vec3 uPlayer;
uniform vec3 uSunDir; uniform vec3 uSunCol;
uniform vec3 uHemiSky; uniform vec3 uHemiGnd;
uniform vec3 uFogColor; uniform vec2 uFogRange;
uniform vec4 uParams;   // segments, vertices per side, lodDist, maxDist
uniform vec2 uSize;     // blade width, height
uniform float uLane;    // half-width of the mowed lane between the fences

varying vec3 vColor;
varying vec4 vParams;   // heightPercent, xSide, highLODOut, gust
varying vec3 vN1;
varying vec3 vN2;
varying vec3 vWorldPos;
varying float vViewZ;

#define PI 3.14159265359

float sat(float x){ return clamp(x, 0.0, 1.0); }
float linstep(float a, float b, float v){ return clamp((v-a)/(b-a), 0.0, 1.0); }
float remap(float v, float a, float b, float c, float d){ return c + (d-c)*((v-a)/(b-a)); }
float easeOut(float x, float t){ return 1.0 - pow(1.0 - x, t); }
float easeIn(float x, float t){ return pow(x, t); }

mat3 rotX(float a){ float c=cos(a), s=sin(a); return mat3(1.,0.,0., 0.,c,-s, 0.,s,c); }
mat3 rotY(float a){ float c=cos(a), s=sin(a); return mat3(c,0.,s, 0.,1.,0., -s,0.,c); }
mat3 rotAxis(vec3 ax, float a){
  ax = normalize(ax); float s = sin(a), c = cos(a), oc = 1.0 - c;
  return mat3(oc*ax.x*ax.x+c,      oc*ax.x*ax.y-ax.z*s, oc*ax.z*ax.x+ax.y*s,
              oc*ax.x*ax.y+ax.z*s, oc*ax.y*ax.y+c,      oc*ax.y*ax.z-ax.x*s,
              oc*ax.z*ax.x-ax.y*s, oc*ax.y*ax.z+ax.x*s, oc*ax.z*ax.z+c);
}

// ---- terrain: must match the JS hash/valueNoise/terrainHeight exactly ----
float hashCell(ivec2 v){
  uint n = (uint(v.x) * 0x27d4eb2du) ^ (uint(v.y) * 0x165667b1u);
  n = (n ^ (n >> 15u)) * 0x85ebca6bu;
  n = n ^ (n >> 13u);
  return float(n >> 8u) * (1.0 / 16777216.0);
}
float vnoise(vec2 p){
  vec2 i = floor(p), f = fract(p);
  vec2 u = f*f*(3.0-2.0*f);
  ivec2 c = ivec2(i);
  float a = hashCell(c),             b = hashCell(c + ivec2(1,0));
  float d = hashCell(c + ivec2(0,1)), e = hashCell(c + ivec2(1,1));
  return a*(1.0-u.x)*(1.0-u.y) + b*u.x*(1.0-u.y) + d*(1.0-u.x)*u.y + e*u.x*u.y;
}
float terrainH(vec2 p){
  return 7.5*vnoise(p*0.018) + 2.6*vnoise(vec2(p.x*0.055, p.y*0.05))
       + 0.7*vnoise(vec2(p.x*0.16, p.y*0.15)) - 5.0;
}

// ---- per-blade + wind noise (murmur on float bits — Quick_Grass style) ----
uvec4 murmur42(uvec2 src){
  const uint M = 0x5bd1e995u;
  uvec4 h = uvec4(1190494759u, 2147483647u, 3559788179u, 179424673u);
  src *= M; src ^= src>>24u; src *= M;
  h *= M; h ^= src.x; h *= M; h ^= src.y;
  h ^= h>>13u; h *= M; h ^= h>>15u;
  return h;
}
uint murmur12(uvec2 src){
  const uint M = 0x5bd1e995u;
  uint h = 1190494759u;
  src *= M; src ^= src>>24u; src *= M;
  h *= M; h ^= src.x; h *= M; h ^= src.y;
  h ^= h>>13u; h *= M; h ^= h>>15u;
  return h;
}
vec4 hash42(vec2 s){
  uvec4 h = murmur42(uvec2(floatBitsToUint(s.x), floatBitsToUint(s.y)));
  return vec4(h & 0x007fffffu) * (1.0 / 8388607.0);
}
float hash12(vec2 s){
  uint h = murmur12(uvec2(floatBitsToUint(s.x), floatBitsToUint(s.y)));
  return float(h & 0x007fffffu) * (1.0 / 8388607.0);
}
float noise12(vec2 p){
  vec2 i = floor(p), f = fract(p);
  vec2 u = f*f*(3.0-2.0*f);
  float v = mix(mix(hash12(i),               hash12(i + vec2(1,0)), u.x),
                mix(hash12(i + vec2(0,1)),   hash12(i + vec2(1,1)), u.x), u.y);
  return v*2.0 - 1.0;
}
`;

const GRASS_VERT = GRASS_GLSL + `
attribute float vertIndex;

void main(){
  float VERTICES = uParams.y;
  float vertFI = vertIndex;
  float vertID = mod(vertFI, VERTICES);
  float zSide  = -(floor(vertFI / VERTICES) * 2.0 - 1.0);   // +1 front, -1 back
  float xSide  = mod(vertID, 2.0);
  float heightPercent = (vertID - xSide) / (uParams.x * 2.0);

  // Blade root: patch origin + per-instance offset, rooted on the terrain.
  vec3 offs = vec3(position.x, 0.0, position.z);
  vec2 rootXZ = (modelMatrix * vec4(offs, 1.0)).xz;
  vec3 rootW = vec3(rootXZ.x, terrainH(rootXZ), rootXZ.y);

  vec4 h4  = hash42(rootXZ);
  vec4 h4b = hash42(rootXZ + 137.31);

  float distCam = distance(cameraPosition, rootW);
  float highLODOut = smoothstep(uParams.z * 0.5, uParams.z, distCam);
  float fadeOut = smoothstep(uParams.z, uParams.w, distCam);    // → nothing at max dist

  // the lane between the picket fences is mowed short (and its blades wider,
  // so the short grass still closes into a lawn instead of going bald)
  float lane = 1.0 - smoothstep(uLane - 0.7, uLane + 0.5, abs(rootXZ.x));

  float randomAngle  = h4.x * 2.0 * PI;
  float randomShade  = remap(h4.y, 0.0, 1.0, 0.65, 1.0);
  float randomHeight = remap(h4.z, 0.0, 1.0, 0.70, 1.45) * (1.0 - fadeOut)
                     * mix(1.0, 0.42, lane);
  float randomWidth  = mix(1.0, 2.4, lane) * (1.0 + fadeOut * 1.5);
  float randomLean   = remap(h4.w, 0.0, 1.0, 0.10, 0.35);

  float bladeHeight = uSize.y * randomHeight;
  float widthHi = easeOut(1.0 - heightPercent, 2.0);            // tapered to a point
  float widthLo = 1.0 - heightPercent;
  float bladeWidth = uSize.x * mix(widthHi, widthLo, highLODOut) * randomWidth;

  float x = (xSide - 0.5) * bladeWidth;
  float y = heightPercent * bladeHeight;

  // --- wind: a slowly wandering direction field, leaning whole blades ---
  float windAngle = 0.61 + noise12(rootXZ * 0.05 + 0.05 * uTime) * 0.9;
  vec3 windAxis = vec3(cos(windAngle), 0.0, sin(windAngle));
  float windNoise = noise12(rootXZ * 0.25 + uTime * 1.0);
  float windLean = easeIn(remap(windNoise, -1.0, 1.0, 0.25, 1.0), 2.0) * 1.15;

  // broken gust fronts sweep along the prevailing wind; sheltered patches a
  // few metres across visibly skip them. They modulate the lean, and feed
  // the silvery crest shimmer in the fragment shader.
  vec2 wdir = vec2(0.82, 0.57);
  float along = dot(rootXZ, wdir);
  float perp  = dot(rootXZ, vec2(-wdir.y, wdir.x));
  float front = sin(along * 0.085 - uTime * 1.0 + sin(perp * 0.20 + uTime * 0.25) * 1.7)
              + 0.7 * sin(along * 0.05 - uTime * 0.6 + perp * 0.14 + 2.0)
              + 0.4 * sin(perp * 0.17 - uTime * 0.38);
  float gustEnv = smoothstep(0.85, 1.7, front);
  float sN = sin(rootXZ.x * 0.43 + 1.3) * sin(rootXZ.y * 0.37 - 0.7)
           + 0.6 * sin(rootXZ.x * 0.19 - rootXZ.y * 0.24 + 2.1);
  float shelter = clamp(1.0 - 0.85 * smoothstep(0.15, 1.0, sN), 0.15, 1.0);
  windLean *= (0.55 + gustEnv * (0.4 + 1.2 * h4b.x)) * shelter;
  windLean *= heightPercent;

  // slow per-blade oscillation so neighbours never move in lockstep
  randomLean += noise12(vec2(uTime * 0.35) + rootXZ * 137.423) * 0.1;

  // --- wading through pushes blades away from the player's feet ---
  float distToPlayer = distance(rootXZ, uPlayer.xz);
  float playerLean = 0.55 * smoothstep(2.2, 0.35, distToPlayer)
                   * linstep(0.9, 0.15, windLean);
  vec3 toPlayer = normalize(vec3(uPlayer.x - rootW.x, 0.0, uPlayer.z - rootW.z) + 1e-5);
  vec3 playerAxis = vec3(toPlayer.z, 0.0, -toPlayer.x);

  // --- curl the blade and derive curved normals from the curve tangent ---
  float easedHeight = mix(easeIn(heightPercent, 2.0), 1.0, highLODOut);
  float curveAmount = -randomLean * easedHeight;

  vec3 n1 = rotX(curveAmount)       * vec3(0.0,  heightPercent + 0.01, 0.0);
  vec3 n2 = rotX(curveAmount * 0.9) * vec3(0.0, (heightPercent + 0.01) * 0.9, 0.0);
  vec3 ncurve = normalize(n1 - n2);

  mat3 grassMat = rotAxis(playerAxis, playerLean)
                * rotAxis(windAxis, windLean)
                * rotY(randomAngle);

  vec3 faceN = grassMat * vec3(0.0, 0.0, 1.0) * zSide;

  // two normals rotated across the width fake a curved cross-section;
  // the fragment shader blends them by xSide
  vec3 vertN = vec3(0.0, -ncurve.z, ncurve.y);
  vec3 nrm1 = grassMat * (rotY(PI *  0.3 * zSide) * vertN) * zSide;
  vec3 nrm2 = grassMat * (rotY(PI * -0.3 * zSide) * vertN) * zSide;

  vec3 pos = grassMat * (rotX(curveAmount) * vec3(x, y, 0.0));
  vec3 worldPos = rootW + pos;

  // colours: dark base to pale tip, per-blade jitter, soft large-scale patches
  float patchHue = noise12(rootXZ * 0.043);
  vec3 b1 = vec3(0.032, 0.110, 0.012), b2 = vec3(0.060, 0.170, 0.026);
  vec3 t1 = vec3(0.500, 0.740, 0.140), t2 = vec3(0.720, 0.860, 0.220);
  vec3 baseC = mix(b1, b2, h4b.y);
  vec3 tipC  = mix(t1, t2, h4b.z);
  vec3 highC = mix(baseC, tipC, easeIn(heightPercent, 3.0)) * randomShade;
  vec3 lowC  = mix(b1, t1, heightPercent) * randomShade;
  vColor = mix(highC, lowC, highLODOut) * (0.9 + 0.22 * patchHue);

  // near: mostly lit like the ground (soft), far: exactly like the ground —
  // this is what stops distant grass dissolving into shading noise
  float skyBlend = (1.0 - highLODOut) * 0.25;
  vN1 = normalize(mix(vec3(0.0, 1.0, 0.0), nrm1, skyBlend));
  vN2 = normalize(mix(vec3(0.0, 1.0, 0.0), nrm2, skyBlend));

  vec4 mv = viewMatrix * vec4(worldPos, 1.0);

  // view-space thickening: edge-on blades get pushed apart so they never
  // alias away to nothing
  vec3 viewDirXZ = normalize(vec3(cameraPosition.x - rootW.x, 0.0, cameraPosition.z - rootW.z));
  vec3 faceXZ = normalize(vec3(faceN.x, 0.0, faceN.z));
  float vdn = sat(dot(faceXZ, viewDirXZ));
  float thicken = easeOut(1.0 - vdn, 4.0) * smoothstep(0.0, 0.2, vdn);
  mv.x += thicken * (xSide - 0.5) * bladeWidth * 0.5 * zSide;

  gl_Position = projectionMatrix * mv;
  vParams = vec4(heightPercent, xSide, highLODOut, gustEnv * shelter);
  vWorldPos = worldPos;
  vViewZ = -mv.z;
}`;

const GRASS_FRAG = GRASS_GLSL + `
layout(location = 0) out vec4 outColor;

void main(){
  float hp = vParams.x, xSide = vParams.y, lodOut = vParams.z, gust = vParams.w;
  vec3 N = normalize(mix(vN1, vN2, xSide));
  vec3 V = normalize(cameraPosition - vWorldPos);

  float ao = mix(0.30, 1.0, easeIn(hp, 2.0));          // buried bases, lit tips
  float crease = mix(0.88, 1.0, abs(xSide - 0.5) * 2.0);
  vec3 albedo = vColor * ao * mix(crease, 1.0, lodOut);

  // the silvery crest riding each gust — strongest at the tips
  albedo = mix(albedo, vec3(0.62, 0.80, 0.26), gust * (0.15 + 0.55 * hp) * 0.45);

  vec3 hemi = mix(uHemiGnd, uHemiSky, N.y * 0.5 + 0.5);

  float wrap = 0.5;                                     // wrapped diffuse
  float ndl = sat((dot(N, uSunDir) + wrap) / (1.0 + wrap));
  vec3 direct = uSunCol * ndl;

  vec3 H = normalize(uSunDir + V);                      // sheen on the tips
  float spec = pow(sat(dot(N, H)), 32.0) * 0.35 * easeIn(hp, 2.0) * (1.0 - lodOut);

  // backscatter: blades glow when the sun is behind them
  float back = sat((dot(V, -uSunDir) + 0.5) / 1.5);
  vec3 scatter = uSunCol * back * 0.45 * (1.0 - lodOut);

  vec3 col = albedo * (hemi + direct + scatter) + uSunCol * spec;

  float fogF = 1.0 - clamp((uFogRange.y - vViewZ) / (uFogRange.y - uFogRange.x), 0.0, 1.0);
  outColor = vec4(mix(col, uFogColor, fogF), 1.0);
}`;

// Blade strip geometry: only an index buffer, a tiny per-vertex id, and one
// instanced offset per blade — the vertex shader builds everything else.
function makeGrassGeometry(segments, blades){
  const VERTICES = (segments + 1) * 2;
  const indices = [];
  for (let i = 0; i < segments; i++){
    const vi = i * 2;
    indices.push(vi+0, vi+1, vi+2,  vi+2, vi+1, vi+3);
    const fi = VERTICES + vi;                       // back face, wound the other way
    indices.push(fi+2, fi+1, fi+0,  fi+3, fi+1, fi+2);
  }
  const vertID = new Float32Array(VERTICES * 2);
  for (let i = 0; i < vertID.length; i++) vertID[i] = i;
  const offsets = new Float32Array(blades * 3);
  for (let i = 0; i < blades; i++){
    offsets[i*3]   = (Math.random() - 0.5) * GRASS_PATCH;
    offsets[i*3+2] = (Math.random() - 0.5) * GRASS_PATCH;
  }
  const geo = new THREE.InstancedBufferGeometry();
  geo.instanceCount = blades;
  geo.setAttribute('vertIndex', new THREE.BufferAttribute(vertID, 1));
  geo.setAttribute('position', new THREE.InstancedBufferAttribute(offsets, 3));
  geo.setIndex(indices);
  geo.boundingSphere = new THREE.Sphere(new THREE.Vector3(0, 0, 0), GRASS_PATCH * 0.75 + 12);
  return geo;
}

function makeGrassMaterial(segments, widthMult){
  return new THREE.ShaderMaterial({
    glslVersion: THREE.GLSL3,
    side: THREE.FrontSide,          // the geometry carries explicit back faces
    uniforms: {
      uTime:    { value: 0 },
      uPlayer:  { value: new THREE.Vector3() },
      uSunDir:  { value: new THREE.Vector3(0, 1, 0) },
      uSunCol:  { value: new THREE.Color() },
      uHemiSky: { value: new THREE.Color() },
      uHemiGnd: { value: new THREE.Color() },
      uFogColor:{ value: new THREE.Color() },
      uFogRange:{ value: new THREE.Vector2(80, 170) },
      uParams:  { value: new THREE.Vector4(segments, (segments+1)*2, GRASS_LOD_DIST, GRASS_MAX_DIST) },
      uSize:    { value: new THREE.Vector2(GRASS_W * widthMult, GRASS_H) },
      uLane:    { value: 4.0 }
    },
    vertexShader: GRASS_VERT,
    fragmentShader: GRASS_FRAG
  });
}

// Three tiers: dense curved blades near, straight blades at mid range, and a
// sparser ring of wide blades that fade out into the painted ground texture.
const grassTiers = [
  { upTo: GRASS_LOD_DIST, geo: makeGrassGeometry(GRASS_SEG_HI, GRASS_BLADES),     mat: makeGrassMaterial(GRASS_SEG_HI, 1.0), pool: [] },
  { upTo: GRASS_MID_DIST, geo: makeGrassGeometry(GRASS_SEG_LO, GRASS_BLADES),     mat: makeGrassMaterial(GRASS_SEG_LO, 1.0), pool: [] },
  { upTo: GRASS_MAX_DIST, geo: makeGrassGeometry(GRASS_SEG_LO, GRASS_FAR_BLADES), mat: makeGrassMaterial(GRASS_SEG_LO, 2.2), pool: [] },
];
const grassGroup = new THREE.Group();
scene.add(grassGroup);

const _m = new THREE.Matrix4(), _q = new THREE.Quaternion(),
      _p = new THREE.Vector3(), _s = new THREE.Vector3(), _e = new THREE.Euler();
function updateGrass(t){
  // mirror the scene's living light + fog into the grass materials
  for (const tier of grassTiers){
    const u = tier.mat.uniforms;
    u.uTime.value = t;
    u.uPlayer.value.set(player.x, 0, player.z);
    u.uSunDir.value.copy(sunDirVec);
    u.uSunCol.value.copy(sun.color).multiplyScalar(sun.intensity);
    u.uHemiSky.value.copy(hemi.color).multiplyScalar(hemi.intensity);
    u.uHemiGnd.value.copy(hemi.groundColor).multiplyScalar(hemi.intensity);
    u.uFogColor.value.copy(scene.fog.color);
    u.uFogRange.value.set(scene.fog.near, scene.fog.far);
    u.uLane.value = FENCE_HALF;
  }
  // place pooled patch meshes on the world grid around the player; the tier
  // (and so the blade geometry) depends on distance to the nearest point of
  // the patch, and three.js frustum-culls the rest via the bounding spheres
  for (const m of grassGroup.children) m.visible = false;
  const used = grassTiers.map(() => 0);
  const bx = Math.floor(player.x / GRASS_PATCH) * GRASS_PATCH;
  const bz = Math.floor(player.z / GRASS_PATCH) * GRASS_PATCH;
  const R = Math.ceil(GRASS_MAX_DIST / GRASS_PATCH);
  for (let cx = -R; cx <= R; cx++){
    for (let cz = -R; cz <= R; cz++){
      const px = bx + cx * GRASS_PATCH + GRASS_PATCH / 2;   // patch centre
      const pz = bz + cz * GRASS_PATCH + GRASS_PATCH / 2;
      const dx = Math.max(Math.abs(player.x - px) - GRASS_PATCH / 2, 0);
      const dz = Math.max(Math.abs(player.z - pz) - GRASS_PATCH / 2, 0);
      const d = Math.hypot(dx, dz);
      const ti = grassTiers.findIndex((tier) => d <= tier.upTo);
      if (ti < 0) continue;
      const tier = grassTiers[ti];
      if (used[ti] >= tier.pool.length){
        const m = new THREE.Mesh(tier.geo, tier.mat);
        tier.pool.push(m); grassGroup.add(m);
      }
      const m = tier.pool[used[ti]++];
      m.position.set(px, 0, pz);
      m.visible = true;
    }
  }
}

/* ============================================================
   Living sky — gradient dome with sun, moon, and stars, all
   driven by a slow day -> dusk -> night -> dawn cycle.
   ============================================================ */
const skyU = {
  top:{value:new THREE.Color()}, horizon:{value:new THREE.Color()},
  sunDir:{value:new THREE.Vector3()}, moonDir:{value:new THREE.Vector3()},
  sunTint:{value:new THREE.Color()}, nightF:{value:0}, uTime:{value:0}
};
const skyMat = new THREE.ShaderMaterial({
  side:THREE.BackSide, depthWrite:false, uniforms:skyU,
  vertexShader:`varying vec3 vDir; void main(){ vDir=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader:`
    varying vec3 vDir;
    uniform vec3 top, horizon, sunDir, moonDir, sunTint; uniform float nightF, uTime;
    float h21(vec2 p){ p=fract(p*vec2(123.34,345.45)); p+=dot(p,p+34.345); return fract(p.x*p.y); }
    float stars(vec3 d){
      vec2 uv = vec2(atan(d.z,d.x), acos(clamp(d.y,-1.0,1.0))) * 60.0;
      vec2 g=floor(uv), f=fract(uv)-0.5;
      float r=h21(g);
      float present=step(0.93, r);
      vec2 c=(vec2(h21(g+1.7), h21(g+4.3))-0.5)*0.7;
      float br=present*smoothstep(0.16,0.0,length(f-c));
      float tw=0.6+0.4*sin(uTime*3.0 + r*42.0);
      return br*tw*(0.4+0.6*h21(g+7.1));
    }
    void main(){
      vec3 d=normalize(vDir);
      float t=pow(clamp(d.y*1.1,0.0,1.0),0.6);
      vec3 col=mix(horizon, top, t);
      float sd=max(dot(d, normalize(sunDir)),0.0);
      col += sunTint * (pow(sd,10.0)*0.10 + pow(sd,180.0)*0.7);
      col += vec3(1.0,0.92,0.74) * smoothstep(0.9994,0.99975,sd) * 4.0;     // sun disc -> bloom
      float md=max(dot(d, normalize(moonDir)),0.0);
      col += vec3(0.6,0.7,1.0) * pow(md,60.0) * 0.3 * nightF;
      col += vec3(0.95,0.97,1.1) * smoothstep(0.9992,0.99965,md) * 2.6 * nightF; // moon disc
      if(d.y>0.0) col += vec3(0.9,0.95,1.0) * stars(d) * nightF;
      gl_FragColor=vec4(col,1.0);
    }`
});

const duskTop=new THREE.Color(0x33356e), duskHor=new THREE.Color(0xff7e3d);
const nightTop=new THREE.Color(0x04060e), nightHor=new THREE.Color(0x0d1430);
const sunDayTint=new THREE.Color(0xfff3d0), sunDuskTint=new THREE.Color(0xff7320);
const hemiSkyDay=new THREE.Color(0xbfe1ff), hemiSkyNight=new THREE.Color(0x141a2e);
const hemiGndDay=new THREE.Color(0x6b8f4a), hemiGndNight=new THREE.Color(0x0a1410);

const sunDirVec=new THREE.Vector3(), moonDirVec=new THREE.Vector3();
const topC=new THREE.Color(), horC=new THREE.Color(), sunTintC=new THREE.Color(), cloudC=new THREE.Color();
const CYCLE = 280;                 // seconds for a full day
let skyNightF = 0;

function updateSky(t){
  const ang = 1.1;                               // PINNED: permanent bright, sunny day
  const e = Math.sin(ang);                       // sun elevation -1..1
  sunDirVec.set(Math.cos(ang)*0.5, e, 0.32).normalize();
  moonDirVec.copy(sunDirVec).multiplyScalar(-1);
  const dayF = smoothstep(-0.08, 0.32, e);
  const nightF = 1 - dayF;
  const duskF = THREE.MathUtils.clamp(1 - Math.abs(e)/0.25, 0, 1);
  skyNightF = nightF;

  topC.copy(nightTop).lerp(dayTop, dayF).lerp(duskTop, duskF*0.6);
  horC.copy(nightHor).lerp(dayHor, dayF).lerp(duskHor, duskF*0.85);
  sunTintC.copy(sunDayTint).lerp(sunDuskTint, duskF);

  skyU.top.value.copy(topC); skyU.horizon.value.copy(horC);
  skyU.sunDir.value.copy(sunDirVec); skyU.moonDir.value.copy(moonDirVec);
  skyU.sunTint.value.copy(sunTintC); skyU.nightF.value=nightF; skyU.uTime.value=t;

  hemi.color.copy(hemiSkyNight).lerp(hemiSkyDay, dayF);
  hemi.groundColor.copy(hemiGndNight).lerp(hemiGndDay, dayF);
  hemi.intensity = 0.45 + 1.0*dayF;
  sun.position.copy(sunDirVec).multiplyScalar(140);
  sun.intensity = 1.7*Math.max(0, dayF);
  sun.color.copy(WHITE).lerp(sunDuskTint, duskF*0.85);
  moon.position.copy(moonDirVec).multiplyScalar(140);
  moon.intensity = 0.45*nightF;

  scene.fog.color.copy(horC).multiplyScalar(0.98);  // near sky colour — light, sunny haze
  scene.fog.near = 80 + 20*dayF;    // much less foggy: clear out to ~100 units
  scene.fog.far  = 130 + 40*dayF;   // gentle haze fades the far hills (≈ terrain edge)

  cloudC.copy(cloudDay).lerp(cloudNight, nightF*0.8).lerp(cloudDusk, duskF*0.5);
  cloudMat.color.copy(cloudC);
  cloudMat.opacity = 0.9 - 0.4*nightF;   // bright white clouds by day
  ffMat.opacity = 0.16 + 0.7*nightF;   // motes -> fireflies after dark
  ffMat.size    = 0.32 + 0.55*nightF;
}

    const tip = new THREE.ConeGeometry(0.085, 0.18, 4); tip.rotateY(Math.PI/4); tip.translate(0, 1.19, z);

}

function updateFence(pz){
  const cell = Math.round(pz/FENCE_SEG);
  if(cell===lastFenceCell) return;
  lastFenceCell = cell;
  const half = Math.floor(FENCE_SECTIONS/2); let i=0;
  for(let s=-half; s<half; s++){
    const z = (cell+s)*FENCE_SEG;
    const zA = z - FENCE_SEG/2, zB = z + FENCE_SEG/2;   // this section's two ends
    for(const fx of FENCE_XS){
      // pitch each section to span the terrain between its ends, so consecutive
      // sections meet at the same ground points and the rail follows the hills
      // continuously instead of stair-stepping.
      const hA = terrainHeight(fx, zA), hB = terrainHeight(fx, zB);
      const pitch = -Math.atan2(hB - hA, FENCE_SEG);
      _p.set(fx, (hA + hB) * 0.5, z);
      _e.set(pitch, 0, 0); _q.setFromEuler(_e);
      _s.set(1, 1, 1);
      _m.compose(_p,_q,_s); fence.setMatrixAt(i++, _m);

}

  const hR = terrainHeight( FENCE_HALF, GATE_Z);
  // tall posts that sit on the ground at each side (bottom slightly buried)
  const pL = new THREE.Mesh(new THREE.BoxGeometry(postW, postH, postW), fenceMat);
  pL.position.set(-FENCE_HALF, hL + postH/2 - 0.15, 0); gate.add(pL);
  const pR = new THREE.Mesh(new THREE.BoxGeometry(postW, postH, postW), fenceMat);
  pR.position.set( FENCE_HALF, hR + postH/2 - 0.15, 0); gate.add(pR);
  // tall arch beam across the top + a lower cross-rail
  const topY = Math.max(hL, hR) + postH - 0.45;
  const beam = new THREE.Mesh(new THREE.BoxGeometry(FENCE_HALF*2 + 0.7, 0.32, 0.32), fenceMat);
  beam.position.set(0, topY, 0); gate.add(beam);
  const rail = new THREE.Mesh(new THREE.BoxGeometry(FENCE_HALF*2 + 0.2, 0.12, 0.12), fenceMat);
  rail.position.set(0, topY - 0.5, 0); gate.add(rail);
  // gate leaves, hinged at each post, sitting on the ground (not buried)
  const leafGeo = buildFencePanel(FENCE_HALF - 0.4);
  const left = new THREE.Mesh(leafGeo, fenceMat);  left.position.set(-FENCE_HALF, hL, 0);  left.rotation.y = -OA;
  const right = new THREE.Mesh(leafGeo, fenceMat); right.position.set( FENCE_HALF, hR, 0);  right.rotation.y = Math.PI + OA;
  gate.add(left, right);
  gate.position.set(0, 0, GATE_Z);
  scene.add(gate);
})();

// a small mailbox just outside the gate
(function buildMailbox(){
  const mb = new THREE.Group();
  const postMat = new THREE.MeshStandardMaterial({ color:0x5a3c26, roughness:0.9 });
  const boxMat  = new THREE.MeshStandardMaterial({ color:0x3a4f6b, roughness:0.55, metalness:0.2 });
  const flagMat = new THREE.MeshStandardMaterial({ color:0xc0392b, roughness:0.7 });
  const post = new THREE.Mesh(new THREE.BoxGeometry(0.08, 1.0, 0.08), postMat); post.position.y = 0.5; mb.add(post);
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.20, 0.36), boxMat); body.position.y = 1.02; mb.add(body);
  const roof = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 0.36, 14), boxMat);
  roof.rotation.x = Math.PI/2; roof.position.y = 1.12; mb.add(roof);
  const fpole = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.16, 0.02), flagMat); fpole.position.set(0.12, 1.10, 0.15); mb.add(fpole);
  const flag  = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.09, 0.10), flagMat); flag.position.set(0.12, 1.15, 0.10); mb.add(flag);
  const gx = FENCE_HALF + 0.9, gz = GATE_Z - 0.6;
  mb.position.set(gx, terrainHeight(gx, gz), gz);
  scene.add(mb);
})();

/* ============================================================
   The house at the end of the lane. Pinned due north of the
   player, it always stays exactly the same distance ahead, so
   no matter how far you walk it never comes any closer.
   ============================================================ */
const HOUSE_DIST = 85, GROUND_SINK = 5.0;
const house = new THREE.Group();
const moundR = 16, moundTop = moundR*0.5;
const moundTex = groundTex.clone(); moundTex.needsUpdate = true; moundTex.repeat.set(5, 3);
const mound = new THREE.Mesh(
  new THREE.SphereGeometry(moundR, 32, 16, 0, Math.PI*2, 0, Math.PI*0.5),
  new THREE.MeshStandardMaterial({ map:moundTex, color:0xffffff, roughness:1 }));
mound.scale.y = 0.5; house.add(mound);

const wallMat = new THREE.MeshStandardMaterial({ color:0xe9e4d6, roughness:0.9 });
const body = new THREE.Mesh(new THREE.BoxGeometry(7, 5, 6), wallMat); body.position.y = moundTop + 2.5; house.add(body);
const roof = new THREE.Mesh(new THREE.ConeGeometry(5.7, 3.4, 4),
  new THREE.MeshStandardMaterial({ color:0x7c3a2c, roughness:0.85 }));
roof.rotation.y = Math.PI/4; roof.position.y = moundTop + 6.7; house.add(roof);
const chimney = new THREE.Mesh(new THREE.BoxGeometry(0.8, 2.3, 0.8),
  new THREE.MeshStandardMaterial({ color:0x6a4636, roughness:1 }));
chimney.position.set(1.9, moundTop + 5.6, 0.6); house.add(chimney);
const door = new THREE.Mesh(new THREE.PlaneGeometry(1.3, 2.3),
  new THREE.MeshStandardMaterial({ color:0x37271f, roughness:1, side:THREE.DoubleSide }));
door.position.set(0, moundTop + 1.15, 3.01); house.add(door);
const winMat = new THREE.MeshStandardMaterial({ color:0xffe6a6, emissive:0xffcc66, emissiveIntensity:0.5, roughness:0.6 });
for(const x of [-2.1, 2.1]){
  const w = new THREE.Mesh(new THREE.PlaneGeometry(1.2, 1.2), winMat);
  w.position.set(x, moundTop + 3.2, 3.01); house.add(w);
}
scene.add(house);
function updateHouse(){
  const hz = player.z - HOUSE_DIST;                // always the same distance ahead — never closer
  house.position.set(player.x, terrainHeight(player.x, hz) - GROUND_SINK, hz);
  winMat.emissiveIntensity = 0.5 + 2.2*skyNightF;  // windows glow brighter after dark
}

/* ============================================================
   Player + controls (Pointer Events: independent move & look).
   ============================================================ */
const player = new THREE.Vector3(0, 0, 0);
let yaw = 0, pitch = -0.05;
const move = { x:0, y:0 };
const keys = {};
const SPEED = 7.5;

let lookId=null, lastLX=0, lastLY=0;
const stick=document.getElementById('stick');
const nub=stick.querySelector('.nub');
let stickId=null, stickCX=0, stickCY=0;
function updateStick(x,y){
  let dx=x-stickCX, dy=y-stickCY; const max=52, len=Math.hypot(dx,dy);
  if(len>max){ dx*=max/len; dy*=max/len; }
  nub.style.transform=`translate(${dx}px,${dy}px)`; move.x=dx/max; move.y=dy/max;
}
function inStick(x,y){ const r=stick.getBoundingClientRect(); return x>=r.left-24 && x<=r.right+24 && y>=r.top-24 && y<=r.bottom+24; }
window.addEventListener('pointerdown', e=>{
  if(!started) return;
  if(e.target===soundBtn) return;
  if(stickId===null && inStick(e.clientX,e.clientY)){
    stickId=e.pointerId; const r=stick.getBoundingClientRect();
    stickCX=r.left+r.width/2; stickCY=r.top+r.height/2; updateStick(e.clientX,e.clientY);
  } else if(e.pointerType==='touch' && lookId===null){ // touch: drag to look
    lookId=e.pointerId; lastLX=e.clientX; lastLY=e.clientY;
  }
});
window.addEventListener('pointermove', e=>{
  if(e.pointerId===stickId){ updateStick(e.clientX,e.clientY); }
  else if(e.pointerId===lookId){
    yaw -= (e.clientX-lastLX)*0.0045; pitch -= (e.clientY-lastLY)*0.0045;
    pitch = THREE.MathUtils.clamp(pitch, -1.2, 1.0); lastLX=e.clientX; lastLY=e.clientY;
  }
});

// DESKTOP: pointer-lock mouse-look — move the mouse to look (same as the cabin).
// One click captures the mouse (and resumes audio); after that it's delta-based,
// no clicking-and-holding.
canvas.addEventListener('click', ()=>{
  if(!started) return;
  if(actx && actx.state==='suspended') actx.resume();
  if(document.pointerLockElement!==canvas && canvas.requestPointerLock) canvas.requestPointerLock();
});
document.addEventListener('mousemove', e=>{
  if(document.pointerLockElement!==canvas) return;
  yaw   -= (e.movementX||0)*0.0022;
  pitch -= (e.movementY||0)*0.0022;
  pitch  = THREE.MathUtils.clamp(pitch, -1.2, 1.0);
});
function endPointer(e){
  if(e.pointerId===stickId){ stickId=null; move.x=0; move.y=0; nub.style.transform='translate(0,0)'; }
  if(e.pointerId===lookId){ lookId=null; }
}
window.addEventListener('pointerup', endPointer);
window.addEventListener('pointercancel', endPointer);
window.addEventListener('keydown', e=>keys[e.code]=true);
window.addEventListener('keyup',   e=>keys[e.code]=false);
// Esc returns to the cabin when this game is embedded in the Prism TV overlay
window.addEventListener('keydown', e=>{ if(e.key==='Escape') parent.postMessage({type:'prism-exit'},'*'); });

/* ============================================================
   Generative eerie ambient sound + SFX (Web Audio API).
   ============================================================ */
let actx=null, master=null, fxDelay=null, noiseBuf=null, musicOn=true;
function startAudio(){
  if(actx) return;
  actx = new (window.AudioContext||window.webkitAudioContext)();
  master = actx.createGain(); master.gain.value=0.0; master.connect(actx.destination);
  master.gain.linearRampToValueAtTime(0.32, actx.currentTime+4);

  fxDelay=actx.createDelay(2.0); fxDelay.delayTime.value=0.55;
  const fb=actx.createGain(); fb.gain.value=0.45;
  const echoWet=actx.createGain(); echoWet.gain.value=0.5;
  fxDelay.connect(fb); fb.connect(fxDelay); fxDelay.connect(echoWet); echoWet.connect(master);

  const droneFilter=actx.createBiquadFilter(); droneFilter.type='lowpass'; droneFilter.frequency.value=420; droneFilter.Q.value=4;
  droneFilter.connect(master);
  const lfo=actx.createOscillator(); lfo.frequency.value=0.05;
  const lfoGain=actx.createGain(); lfoGain.gain.value=240; lfo.connect(lfoGain); lfoGain.connect(droneFilter.frequency); lfo.start();
  [55, 82.41, 110, 164.81].forEach((f,i)=>{
    const o=actx.createOscillator(); o.type = i%2 ? 'sine':'triangle'; o.frequency.value=f; o.detune.value=(Math.random()*10-5);
    const g=actx.createGain(); g.gain.value=0.16/(i+1); o.connect(g); g.connect(droneFilter);
    const blfo=actx.createOscillator(); blfo.frequency.value=0.03+Math.random()*0.04;
    const bg=actx.createGain(); bg.gain.value=0.06; blfo.connect(bg); bg.connect(g.gain); blfo.start(); o.start();
  });

  noiseBuf=actx.createBuffer(1, actx.sampleRate*3, actx.sampleRate);
  const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  const noise=actx.createBufferSource(); noise.buffer=noiseBuf; noise.loop=true;
  const nf=actx.createBiquadFilter(); nf.type='bandpass'; nf.frequency.value=500; nf.Q.value=0.6;
  const ng=actx.createGain(); ng.gain.value=0.05; noise.connect(nf); nf.connect(ng); ng.connect(master);
  const nlfo=actx.createOscillator(); nlfo.frequency.value=0.07;
  const nlg=actx.createGain(); nlg.gain.value=0.035; nlfo.connect(nlg); nlg.connect(ng.gain); nlfo.start(); noise.start();

  const scale=[220, 261.63, 293.66, 329.63, 392, 440, 523.25, 587.33];
  (function ping(){
    if(actx && musicOn){
      const f=scale[Math.floor(Math.random()*scale.length)] * (Math.random()<0.5?1:2);
      const o=actx.createOscillator(); o.type='sine'; o.frequency.value=f;
      const g=actx.createGain(); const t=actx.currentTime;
      g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.12, t+0.04); g.gain.exponentialRampToValueAtTime(0.0008, t+3.5);
      o.connect(g); g.connect(master); g.connect(fxDelay); o.start(t); o.stop(t+3.8);
    }
    setTimeout(ping, 2500 + Math.random()*6000);
  })();
  setTimeout(caw, 6000 + Math.random()*8000);
}
function footstep(){
  if(!actx) return;
  const t=actx.currentTime;
  const src=actx.createBufferSource(); src.buffer=noiseBuf;
  const lp=actx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=400+Math.random()*180;
  const g=actx.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.10, t+0.01); g.gain.exponentialRampToValueAtTime(0.001, t+0.18);
  src.connect(lp); lp.connect(g); g.connect(master); src.start(t); src.stop(t+0.2);
}
function caw(){
  if(actx){
    const t=actx.currentTime; const pan=actx.createStereoPanner(); pan.pan.value=(Math.random()*2-1)*0.7; pan.connect(master);
    for(let k=0;k<2;k++){
      const o=actx.createOscillator(); o.type='sawtooth'; o.frequency.value=420+Math.random()*120;
      const bp=actx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1200; bp.Q.value=3;
      const g=actx.createGain(); const st=t+k*0.16;
      g.gain.setValueAtTime(0,st); g.gain.linearRampToValueAtTime(0.05, st+0.02); g.gain.exponentialRampToValueAtTime(0.001, st+0.14);
      o.connect(bp); bp.connect(g); g.connect(pan); o.start(st); o.stop(st+0.16);
    }
  }
  setTimeout(caw, 9000 + Math.random()*16000);
}
const soundBtn=document.getElementById('sound');
soundBtn.addEventListener('click', ()=>{
  musicOn=!musicOn;
  if(master) master.gain.linearRampToValueAtTime(musicOn?0.32:0.0, actx.currentTime+0.6);
  soundBtn.textContent = musicOn ? '♪' : '·';
});

/* ============================================================
   Post-processing: bloom + color grade / vignette / film grain.
   ============================================================ */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
// gentle bloom: only genuinely bright things (sun/moon discs, lit windows, fireflies) glow
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.32, 0.45, 0.88);
composer.addPass(bloom);
const GradeShader = {
  uniforms:{ tDiffuse:{value:null}, uTime:{value:0}, uVig:{value:1.15} },
  vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader:`
    uniform sampler2D tDiffuse; uniform float uTime, uVig; varying vec2 vUv;
    float h(vec2 p){ return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453); }
    void main(){
      vec3 c=texture2D(tDiffuse, vUv).rgb;
      c = mix(c, c*vec3(0.96,1.0,1.05), 0.5);                 // gentle cool grade
      vec2 q=vUv-0.5; float v=smoothstep(0.92,0.25,length(q)*uVig);
      c *= mix(0.5, 1.0, v);                                  // vignette
      c += (h(vUv*vec2(1920.0,1080.0)+uTime)-0.5)*0.025;      // film grain
      gl_FragColor=vec4(c,1.0);
    }`
};
const grade = new ShaderPass(GradeShader);
composer.addPass(grade);
composer.addPass(new OutputPass());

/* ============================================================
   Game loop
   ============================================================ */
let started=false, stepAccum=1.9;
const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(), 0.05);
  const t=clock.elapsedTime;
  grade.uniforms.uTime.value = t;

  // movement
  let mx=move.x, mz=move.y;
  if(keys['KeyW']||keys['ArrowUp']) mz-=1;
  if(keys['KeyS']||keys['ArrowDown']) mz+=1;
  if(keys['KeyA']||keys['ArrowLeft']) mx-=1;
  if(keys['KeyD']||keys['ArrowRight']) mx+=1;
  const len=Math.hypot(mx,mz);
  if(len>1){ mx/=len; mz/=len; }
  if(len>0.001){
    const sin=Math.sin(yaw), cos=Math.cos(yaw);
    player.x += ((-sin)*(-mz) + ( cos)*mx) * SPEED * dt;
    player.z += ((-cos)*(-mz) + (-sin)*mx) * SPEED * dt;
  }
  // footstep cadence
  if(started && len>0.05){ stepAccum += SPEED*dt*Math.min(len,1); if(stepAccum>1.9){ stepAccum-=1.9; footstep(); } }
  else stepAccum=1.9;

  updateSky(t);
  updateTerrain(player.x, player.z);
  updateGrass(t);
  updateFence(player.z);
  updateHouse();
  updateFireflies(t);
  updateCrows(t);

  const ground=terrainHeight(player.x, player.z);
  const bob = (len>0.01) ? Math.sin(t*9)*0.06 : 0;
  camera.position.set(player.x, ground+EYE+bob, player.z);
  _e.set(pitch, yaw, 0, 'YXZ'); camera.quaternion.setFromEuler(_e);

  sky.position.copy(camera.position);
  for(const c of clouds){
    c.position.x += c.userData.drift*dt;
    c.position.y += Math.sin(t*0.2 + c.userData.bob)*0.02;
    const rx=c.position.x-camera.position.x, rz=c.position.z-camera.position.z;
    if(rx>500) c.position.x-=1000; if(rx<-500) c.position.x+=1000;
    if(rz>500) c.position.z-=1000; if(rz<-500) c.position.z+=1000;
    c.lookAt(camera.position.x, c.position.y, camera.position.z);
  }

  composer.render();
}

/* ---------- boot ---------- */
function resize(){
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
}
window.addEventListener('resize', resize);

updateSky(0);
updateTerrain(0,0); updateGrass(0); updateFence(0); updateHouse();
animate();

const hud=document.getElementById('hud');
const fade=document.getElementById('fade');
function beginGame(){
  if(started) return; started=true;
  startAudio();
  fade.style.opacity='1';
  setTimeout(()=>{ fade.style.opacity='0'; hud.classList.add('on'); }, 600);
}
// No intro screen — drop straight into the world. (First click captures the
// mouse for look and resumes audio, per browser autoplay rules.)
beginGame();
</script>
</body>
