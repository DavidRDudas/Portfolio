            <textarea id="code-input" spellcheck="false">// Every visual property below is measured from this code.
// Edit it, hit "Map it", and watch the constellation change.

const clamp = (n, lo, hi) => Math.min(hi, Math.max(lo, n));
const lerp = (a, b, t) => a + (b - a) * t;

function parseGrid(raw) {
    const rows = raw.split('\n');
    const cells = [];
    for (const row of rows) {
        if (!row.trim()) continue;
        for (const ch of row) {
            if (ch === '#' || ch === '.') {
                cells.push(ch === '#' ? 1 : 0);
            } else if (ch !== ' ') {
                throw new Error(`bad cell: ${ch}`);
            }
        }
    }
    return cells;
}

// Deeply nested and branchy on purpose: this one becomes a red giant.
function findPath(grid, width, start, goal) {
    const queue = [start];
    const seen = new Set([start]);
    const cameFrom = new Map();
    while (queue.length) {
        const current = queue.shift();
        if (current === goal) {
            const path = [];
            let node = goal;
            while (node !== undefined) {
                path.unshift(node);
                node = cameFrom.get(node);
            }
            return path;
        }
        for (const step of [-1, 1, -width, width]) {
            const next = current + step;
            if (next < 0 || next >= grid.length) continue;
            if (grid[next] === 1 || seen.has(next)) continue;
            if (step === -1 && current % width === 0) continue;
            if (step === 1 && next % width === 0) continue;
            seen.add(next);
            cameFrom.set(next, current);
            queue.push(next);
        }
    }
    return null;
}

// Self-recursive: this star gets a ring.
function flatten(list) {
    return list.reduce((acc, item) => {
        return acc.concat(Array.isArray(item) ? flatten(item) : item);
    }, []);
}

// Mutually recursive: these two form a binary system.
function isEven(n) { return n === 0 ? true : isOdd(n - 1); }
function isOdd(n) { return n === 0 ? false : isEven(n - 1); }

class Renderer {
    constructor(canvas) {
        this.canvas = canvas;
        this.scale = 1;
    }
    draw(cells, width) {
        const size = clamp(this.scale * 8, 4, 32);
        cells.forEach((cell, i) => {
            const x = (i % width) * size;
            const y = Math.floor(i / width) * size;
            this.paint(x, y, size, cell);
        });
    }
    paint(x, y, size, cell) {
        const shade = lerp(20, 240, cell);
        return { x, y, size, shade };
    }
}

function solve(raw, width) {
    const grid = parseGrid(raw);
    const path = findPath(grid, width, 0, grid.length - 1);
    return flatten([path, isEven(path ? path.length : 0)]);
}

// Nothing calls this one, so it collapses into a black hole.
function debugDump(state) {
    const keys = Object.keys(state);
    return keys.map(k => `${k}=${state[k]}`).join(' ');
}
</textarea>
